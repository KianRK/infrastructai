[project]
name = "roadscan-training"
version = "0.1.0"
description = "RDD2022 data pipeline and detector training for RoadScan"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.17",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
