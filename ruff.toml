# Shared by training/ and serving/ (ruff discovers this file from either directory).
line-length = 100
target-version = "py312"
src = ["training/src", "serving/src"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "S", "N"]

[lint.per-file-ignores]
"**/tests/**" = ["S101"] # assert is the point of a test
