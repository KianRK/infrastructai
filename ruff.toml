# Shared by training/ and serving/ (ruff discovers this file from either directory).
line-length = 100
target-version = "py312"
src = ["training/src", "serving/src"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "S", "N"]

[lint.per-file-ignores]
# assert is the point of a test; passwords and keys in tests are fixtures, not secrets
"**/tests/**" = ["S101", "S105", "S106"]
