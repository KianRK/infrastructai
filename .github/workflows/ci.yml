name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.project }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: training
            sync-args: --extra cpu # CPU-only PyTorch; also runs the training smoke test
          - project: serving
            sync-args: ""
    env:
      UV_NO_SYNC: "1" # `uv run` must not re-resolve and drop the selected extras
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: Install dependencies
        run: uv sync --locked ${{ matrix.sync-args }}
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.2"
      - run: terraform fmt -check -diff -recursive
      # No backend and no Azure login: this checks syntax, references and provider schemas.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.1
      - name: Lint and render with the local and the AKS example values
        run: make chart-check
      - name: Shell scripts
        run: shellcheck scripts/*.sh deploy/platform/*.sh

  docker:
    name: Docker (build and run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The images CI builds are the lightweight variants: the serving image without the
      # LLM weights, the training image with CPU-only PyTorch. Same Dockerfiles as the
      # deployed images, different build arguments.
      - name: Build the training image
        run: docker build --build-arg TORCH=cpu -t roadscan-training:ci training
      - name: Training image runs as a non-root user and finds its entry point
        run: |
          test "$(docker run --rm --entrypoint id roadscan-training:ci -u)" != "0"
          docker run --rm roadscan-training:ci rdd.pipeline --help
      - name: Start frontend and backend with docker compose
        run: docker compose up --build --detach --wait
      - name: Smoke test through the gateway
        env:
          ROADSCAN_DEMO_PASSWORD: roadscan-dev # the compose development default
        run: python3 scripts/smoke_test.py http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

