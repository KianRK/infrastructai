# Values for the AKS deployment. Every value is a Terraform output (terraform -chdir=infra
# output); none of them is a secret. `make deploy` fills them in automatically.
image:
  registry: acrroadscanab1cd.azurecr.io # acr_login_server
  tag: "<git commit sha>"

host: roadscan-ab1cd.swedencentral.cloudapp.azure.com # hostname

gateway:
  azure:
    publicIpName: pip-roadscan-gateway # gateway_public_ip_name
    publicIpResourceGroup: rg-roadscan # resource_group

secrets:
  keyVault:
    name: kv-roadscan-app-ab1cd # key_vault_name
    tenantId: 00000000-0000-0000-0000-000000000000 # tenant_id

serviceAccount:
  workloadIdentityClientId: 00000000-0000-0000-0000-000000000000 # serving_identity_client_id

serve:
  mlflowTrackingUri: azureml://swedencentral.api.azureml.ms/mlflow/v1.0/subscriptions/... # mlflow_tracking_uri

ray:
  head:
    nodeSelector:
      roadscan/pool: cpu

frontend:
  nodeSelector:
    roadscan/pool: cpu
