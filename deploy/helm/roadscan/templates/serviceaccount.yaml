{{- include "roadscan.validate" . }}
# Identity of the Ray pods. On AKS it is federated with a managed identity (Workload
# Identity), which may read the Key Vault secrets and the model registry.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "roadscan.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.workloadIdentityClientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
# The pods do not talk to the Kubernetes API.
automountServiceAccountToken: false
