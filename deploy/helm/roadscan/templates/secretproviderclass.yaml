{{- if eq .Values.secrets.source "keyVault" }}
# Tells the Secrets Store CSI driver which Key Vault secrets to mount as files.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "roadscan.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.secrets.keyVault.name | quote }}
    tenantId: {{ .Values.secrets.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: demo-password
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
{{- end }}
