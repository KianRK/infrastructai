# Local stand-in for the cluster gateway (Envoy Gateway on AKS): one entry point that
# routes /api to the Ray Serve application and everything else to the frontend, with a
# request size limit and a coarse per-address rate limit in front of the application's own.
limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 11m; # the application accepts 10 MB; allow for multipart overhead

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://serving:8000;
        proxy_set_header Host $host;
        # Overwritten, not appended: whatever the client sent in this header is dropped.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s; # the LLM answers in 10-25 s on two CPU threads
        # The live-traffic event stream is passed on unbuffered: the application sends
        # X-Accel-Buffering: no with it.
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}
