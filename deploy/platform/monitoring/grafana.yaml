# Values for the grafana-community "grafana" chart (see ../install.sh for the version).
# No route from the internet: open it with `make grafana` (kubectl port-forward). The admin
# password is generated by the chart into the Secret "grafana" (key admin-password).

testFramework:
  enabled: false

persistence:
  enabled: false # dashboards and the data source are provisioned from files below

# Grafana 13 was OOM-killed at start with a 256Mi limit (minikube, 2026-11-13).
resources:
  requests:
    cpu: 25m
    memory: 192Mi
  limits:
    memory: 512Mi

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  news:
    news_feed_enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc
        isDefault: true
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: roadscan
        folder: RoadScan
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/roadscan

# ConfigMap created by ../install.sh from the files in dashboards/.
dashboardsConfigMaps:
  roadscan: grafana-dashboards-roadscan
