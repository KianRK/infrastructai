# Ray Serve config for docker compose with the real models (see compose.models.yaml).
# The detector is read from the mounted ./models directory (`make model-fetch`), the LLM
# weights are part of the image.
proxy_location: HeadOnly
http_options:
  host: 0.0.0.0
  port: 8000

applications:
  - name: roadscan
    route_prefix: /
    import_path: app.main:build_app
    args:
      detector:
        backend: onnx
        model_uri: /models/roadscan-detector/model.onnx
        confidence_threshold: 0.25
        threads: 2
      llm:
        backend: llama_cpp
        model_path: /opt/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        threads: 2
        max_tokens: 300
        temperature: 0.2
      traffic:
        # Detector from the mounted ./models directory, videos from the image.
        backend: onnx
        model_uri: /models/roadscan-traffic/model.onnx
        media_dir: /opt/media
        confidence_threshold: 0.35
        threads: 1
      auth:
        # Plain HTTP on localhost; secrets come from ROADSCAN_DEMO_PASSWORD and
        # ROADSCAN_JWT_SECRET (compose.yaml sets development values).
        cookie_secure: false
        # The compose gateway is the one proxy in front and sets X-Forwarded-For.
        trusted_proxy_hops: 1
    deployments:
      - name: Api
        num_replicas: 1
        ray_actor_options: { num_cpus: 0.25 }
      - name: Detector
        num_replicas: 1
        ray_actor_options: { num_cpus: 0.5 }
      - name: Describer
        num_replicas: 1
        # Generation takes 10-25 s on two threads; one request at a time per replica.
        max_ongoing_requests: 1
        ray_actor_options: { num_cpus: 1 }
      - name: Traffic
        # Owns the stream clock and the counters: exactly one replica.
        num_replicas: 1
        ray_actor_options: { num_cpus: 0.5 }
