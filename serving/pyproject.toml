[project]
name = "roadscan-serving"
version = "0.1.0"
description = "Ray Serve application for RoadScan: API, detector, and LLM deployments"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "av>=16,<18",
    "huggingface-hub>=2.4,<3",
    "llama-cpp-python>=0.3.36,<0.4",
    "mlflow-skinny>=3.15,<3.16",
    "numpy>=2,<3",
    "onnxruntime>=1.31,<2",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20",
    "ray[serve]>=2.59,<2.60",
]

# Azure ML as MLflow model registry (the deployed configuration).
[project.optional-dependencies]
azure = ["azureml-mlflow>=1.62.0.post6"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
# Rebuild the project when any of its files change, not only pyproject.toml (uv's
# default). Without this the image builds, which install the project non-editable with a
# persistent uv cache, reused the previously built wheel after source-only changes.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]

# Prebuilt CPU wheels; PyPI only ships a source distribution that needs a C++ toolchain.
[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "onnx>=1.23,<2",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"] # includes knowledge.yaml

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 180 # a Serve app that cannot be scheduled would otherwise hang forever
xfail_strict = true

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnx.*", "llama_cpp.*", "mlflow.*", "huggingface_hub.*"]
ignore_missing_imports = true
follow_imports = "skip"
