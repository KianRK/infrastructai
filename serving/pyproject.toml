[project]
name = "roadscan-serving"
version = "0.1.0"
description = "Ray Serve application for RoadScan: API, detector, and LLM deployments"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
